{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<h1>Регистрация</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Зарегистрироваться</button>
</form>
<p style="margin-top: 15px;">
    Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войти</a>
</p>
{% endblock %}
